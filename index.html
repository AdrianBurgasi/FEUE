<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Bloqueo de indexación vital para la raíz del sitio -->
    <meta name="robots" content="noindex, nofollow">
    <title>Redirigiendo...</title>

    <!-- Método 1: Redirección nativa en HTML (el '0' indica los segundos de espera) -->
    <meta http-equiv="refresh" content="0; url=https://www.uleam.edu.ec/">

    <!-- Método 2: Redirección por JavaScript (actúa como respaldo de seguridad) -->
    <script>
        window.location.replace("https://www.uleam.edu.ec/");
    </script>
</head>
<body style="background-color: #111; color: white; font-family: sans-serif; text-align: center; padding-top: 20vh;">
    <!-- Mensaje visible solo si la redirección falla por una conexión muy lenta -->
    <p>Redirigiendo al sitio oficial...</p>
    <p>Si no eres redirigido automáticamente, <a href="https://www.uleam.edu.ec/" style="color: #e0a922;">haz clic aquí</a>.</p>
</body>
</html>
