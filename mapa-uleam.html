<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101820">
  <meta name="description" content="Mapa interactivo del campus matriz de la ULEAM en Manta.">
  <title>Mapa ULEAM · Campus Manta</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background: #101820;
      color: #eef7fa;
      --map-ratio: 1.50685;
      --glow: #8ceeff;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #101820; }
    .map-stage {
      position: fixed;
      inset: 0;
      display: grid;
      overflow: hidden;
      place-items: center;
      background: radial-gradient(ellipse at center, #1a2a32 0, #101820 72%);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .map-scene {
      position: relative;
      width: min(100vw, calc(100svh * var(--map-ratio)));
      height: min(100svh, calc(100vw * .66364));
    }
    .map-world {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      aspect-ratio: 1200 / 796.363636;
      isolation: isolate;
      transform: translate(-50%, -50%);
    }
    .map-image-frame, .map-image, .map-placeholder, .map-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .map-image-frame { overflow: hidden; }
    .map-image { object-fit: fill; pointer-events: none; -webkit-user-drag: none; }
    .map-image.is-missing { display: none; }
    .map-placeholder { display: none; }
    .map-placeholder.is-visible { display: block; }
    .map-overlay { overflow: visible; pointer-events: none; }
    .campus-block {
      fill: rgba(57, 193, 221, .025);
      stroke: rgba(151, 221, 236, .22);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
      pointer-events: all;
      cursor: pointer;
      outline: none;
      transition: fill .2s ease, stroke .2s ease, filter .2s ease;
      touch-action: none;
    }
    .campus-block.is-active, .campus-block:focus-visible {
      fill: rgba(60, 211, 240, .38);
      stroke: var(--glow);
      stroke-width: 3;
      filter: drop-shadow(0 0 11px rgba(67, 218, 247, .95));
    }
    .block-info {
      position: absolute;
      right: 12px;
      bottom: 12px;
      display: grid;
      max-width: min(290px, calc(100% - 24px));
      gap: 3px;
      padding: 8px 11px;
      border: 1px solid rgba(186, 226, 238, .2);
      border-radius: 8px;
      background: rgba(8, 20, 29, .78);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .2);
      pointer-events: none;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .block-info[hidden] { display: none; }
    .block-info-code { color: #93e8f5; font-size: 8px; font-weight: 700; letter-spacing: .12em; }
    .block-info-name { color: #eef7fa; font-size: 11px; line-height: 1.3; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-width: 650px) {
      .map-scene {
        width: min(100vw, calc(100svh * .66364));
        height: min(100svh, calc(100vw * var(--map-ratio)));
      }
      .map-world {
        width: min(100svh, calc(100vw * var(--map-ratio)));
        transform: translate(-50%, -50%) rotate(-90deg);
      }
      .block-info { right: 8px; bottom: 8px; max-width: calc(100% - 16px); padding: 7px 9px; }
      .block-info-name { font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="map-stage" id="map-stage" aria-label="Mapa interactivo del campus matriz de la ULEAM">
    <p class="sr-only" id="map-help">Pasa el cursor o desplázate para iluminar los bloques. Haz clic o pulsa Enter para seleccionar. En una pantalla táctil, desliza para recorrerlos y toca uno para seleccionarlo.</p>
    <div class="map-scene">
      <div class="map-world">
        <div class="map-image-frame">
          <svg class="map-placeholder" id="map-placeholder" viewBox="0 0 1200 796.363636" role="img" aria-label="Plano esquemático de campus ULEAM">
            <defs>
              <linearGradient id="fallback-ground" x2="0" y2="1"><stop stop-color="#234555"></stop><stop offset="1" stop-color="#132c3b"></stop></linearGradient>
              <pattern id="fallback-grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#90cedb" stroke-opacity=".09"></path></pattern>
            </defs>
            <rect width="1200" height="796" fill="#091a27"></rect>
            <path d="M45 95 900 68 1145 205 1100 690 220 745 45 570Z" fill="url(#fallback-ground)" stroke="#64b7c8" stroke-opacity=".35" stroke-width="2"></path>
            <path d="M45 95 900 68 1145 205 1100 690 220 745 45 570Z" fill="url(#fallback-grid)"></path>
            <g fill="none" stroke="#d4b989" stroke-opacity=".43" stroke-width="16"><path d="M80 560 310 435 560 490 770 330 1050 385"></path><path d="M200 190 365 345 590 225 770 330 930 165"></path><path d="M560 490 610 640 850 565 1010 460"></path></g>
            <g fill="#e4c69a" fill-opacity=".72"><path d="m150 300 78-44 53 31-79 45z"></path><path d="m298 370 80-46 54 32-80 46z"></path><path d="m456 290 88-49 57 33-88 50z"></path><path d="m615 382 92-51 58 34-92 52z"></path><path d="m780 235 95-54 57 33-95 55z"></path><path d="m340 550 92-51 59 34-93 53z"></path><path d="m690 545 94-53 61 35-95 54z"></path></g>
            <text x="84" y="766" fill="#d2e8eb" font-size="13" letter-spacing="2">PLANO ESQUEMÁTICO · AGREGA assets/isometric_uleam.png</text>
          </svg>
          <img class="map-image" id="map-image" src="assets/isometric_uleam.png" alt="Plano isométrico de la Universidad Laica Eloy Alfaro de Manabí, campus Manta" draggable="false">
        </div>
        <svg class="map-overlay" id="map-overlay" viewBox="0 0 1200 796.363636" preserveAspectRatio="xMidYMid meet" role="group" aria-describedby="map-help"></svg>
      </div>
      <aside class="block-info" id="block-info" aria-live="polite" aria-atomic="true" hidden>
        <span class="block-info-code" id="block-info-code"></span>
        <span class="block-info-name" id="block-info-name"></span>
      </aside>
    </div>
    <span class="sr-only" id="map-announcer" aria-live="polite"></span>
  </main>

  <script>
    (() => {
      "use strict";

      const blocks = [
        { id: "b02", nombre: "Bloque 02", codigo: "B-02", points: "846,399 874,376 912,391 895,446 864,432" },
        { id: "b05", nombre: "Bloque 05", codigo: "B-05", points: "866,632 898,622 935,641 920,681 895,704 873,674" },
        { id: "b07", nombre: "Bloque 07", codigo: "BO-7", points: "598,580 629,554 675,576 670,609 636,624 605,607" },
        { id: "b08", nombre: "Bloque 08", codigo: "BO-8", points: "445,578 481,550 580,586 571,621 500,606" },
        { id: "b09", nombre: "Bloque 09", codigo: "B-9", points: "328,585 391,563 404,590 339,615" },
        { id: "b10", nombre: "Bloque 10", codigo: "B-10", points: "155,601 183,576 209,594 191,623 162,626" },
        { id: "b12", nombre: "Bloque 12", codigo: "PB-12", points: "87,568 119,561 132,595 99,608" },
        { id: "b13", nombre: "Bloque 13", codigo: "B-13", points: "223,548 266,521 325,558 300,595 251,580" },
        { id: "b14", nombre: "Bloque 14", codigo: "B-14", points: "252,490 287,464 332,485 306,516 274,526" },
        { id: "b16", nombre: "Bloque 16", codigo: "0-16", points: "461,325 496,285 541,292 519,338 487,352" },
        { id: "b17", nombre: "Bloque 17", codigo: "B-17", points: "455,193 474,160 520,171 502,218 482,229" },
        { id: "iid", nombre: "Bloque IID", codigo: "IID", points: "810,525 839,514 857,535 842,562 815,555" },
        { id: "jmn", nombre: "Juan Montalvo Bloque Nuevo", codigo: "JMN", points: "651,468 680,448 710,464 697,491 666,500" },
        { id: "jma", nombre: "Juan Montalvo Bloque Antiguo", codigo: "JMA", points: "61,337 83,315 120,326 118,359 91,378 70,360" },
        { id: "cac", nombre: "Centro de Atención Ciudadana (C.A.C.)", codigo: "C.A.C.", points: "777,290 806,281 832,300 814,331 788,338 770,318" }
      ];

      const stage = document.getElementById("map-stage");
      const image = document.getElementById("map-image");
      const placeholder = document.getElementById("map-placeholder");
      const overlay = document.getElementById("map-overlay");
      const announcer = document.getElementById("map-announcer");
      const blockInfo = document.getElementById("block-info");
      const blockInfoCode = document.getElementById("block-info-code");
      const blockInfoName = document.getElementById("block-info-name");
      const byId = new Map();
      let highlightedId = null;
      let selectedId = null;
      let gesture = null;
      let suppressClickUntil = 0;
      let lastWheelAt = 0;

      function svgElement(name, attributes) {
        const element = document.createElementNS("http://www.w3.org/2000/svg", name);
        Object.entries(attributes).forEach(([key, value]) => element.setAttribute(key, value));
        return element;
      }

      function setHighlighted(id) {
        highlightedId = id;
        const block = blocks.find((item) => item.id === id);
        blockInfo.hidden = !block;
        if (block) {
          blockInfoCode.textContent = block.codigo;
          blockInfoName.textContent = block.nombre;
        }
        blocks.forEach((block) => {
          const polygon = byId.get(block.id);
          polygon.classList.toggle("is-active", block.id === highlightedId);
          polygon.setAttribute("aria-pressed", String(block.id === selectedId));
        });
      }

      function selectBlock(block) {
        selectedId = block.id;
        setHighlighted(block.id);
        announcer.textContent = `${block.nombre} seleccionado.`;
      }

      function stepHighlight(direction) {
        const currentIndex = blocks.findIndex((block) => block.id === highlightedId);
        const startIndex = currentIndex < 0 ? (direction > 0 ? -1 : 0) : currentIndex;
        const nextIndex = (startIndex + direction + blocks.length) % blocks.length;
        setHighlighted(blocks[nextIndex].id);
      }

      function renderBlocks() {
        const layer = svgElement("g", { "aria-label": "Bloques del campus" });
        blocks.forEach((block) => {
          const polygon = svgElement("polygon", {
            points: block.points,
            class: "campus-block",
            "data-block-id": block.id,
            tabindex: "0",
            role: "button",
            "aria-label": `${block.nombre} (${block.codigo})`,
            "aria-pressed": "false"
          });
          const title = svgElement("title", {});
          title.textContent = `${block.nombre} · pulsa para seleccionar`;
          polygon.appendChild(title);
          polygon.addEventListener("pointerenter", (event) => {
            if (event.pointerType === "mouse") setHighlighted(block.id);
          });
          polygon.addEventListener("pointerleave", () => {
            if (highlightedId === block.id) setHighlighted(selectedId);
          });
          polygon.addEventListener("focus", () => setHighlighted(block.id));
          polygon.addEventListener("blur", () => {
            if (highlightedId === block.id) setHighlighted(selectedId);
          });
          polygon.addEventListener("click", () => {
            if (Date.now() >= suppressClickUntil) selectBlock(block);
          });
          polygon.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              selectBlock(block);
            }
          });
          byId.set(block.id, polygon);
          layer.appendChild(polygon);
        });
        overlay.replaceChildren(layer);
      }

      image.addEventListener("error", () => {
        image.classList.add("is-missing");
        placeholder.classList.add("is-visible");
      });
      image.addEventListener("load", () => {
        image.classList.remove("is-missing");
        placeholder.classList.remove("is-visible");
      });
      if (image.complete && !image.naturalWidth) {
        image.classList.add("is-missing");
        placeholder.classList.add("is-visible");
      }

      renderBlocks();

      stage.addEventListener("wheel", (event) => {
        event.preventDefault();
        if (event.ctrlKey) return;
        const now = Date.now();
        if (now - lastWheelAt < 280 || Math.abs(event.deltaY) < 8) return;
        lastWheelAt = now;
        stepHighlight(event.deltaY > 0 ? 1 : -1);
      }, { passive: false });

      stage.addEventListener("pointerdown", (event) => {
        if (event.pointerType !== "touch") return;
        gesture = { y: event.clientY, baseId: highlightedId, moved: false };
      });
      stage.addEventListener("pointermove", (event) => {
        if (!gesture || event.pointerType !== "touch") return;
        const delta = gesture.y - event.clientY;
        const steps = Math.trunc(delta / 65);
        if (Math.abs(delta) > 30) gesture.moved = true;
        if (steps !== 0) {
          const baseIndex = Math.max(0, blocks.findIndex((block) => block.id === gesture.baseId));
          const targetIndex = (baseIndex + steps % blocks.length + blocks.length) % blocks.length;
          setHighlighted(blocks[targetIndex].id);
        }
      });
      stage.addEventListener("pointerup", (event) => {
        if (!gesture || event.pointerType !== "touch") return;
        if (gesture.moved) suppressClickUntil = Date.now() + 450;
        gesture = null;
      });
      stage.addEventListener("pointercancel", () => { gesture = null; });

      document.addEventListener("keydown", (event) => {
        const isBlock = event.target instanceof Element && event.target.closest(".campus-block");
        if (event.key === "ArrowDown" || event.key === "PageDown" || (event.key === " " && !isBlock && !event.shiftKey)) {
          event.preventDefault();
          stepHighlight(1);
        } else if (event.key === "ArrowUp" || event.key === "PageUp" || (event.key === " " && event.shiftKey && !isBlock)) {
          event.preventDefault();
          stepHighlight(-1);
        }
      });
    })();
  </script>
</body>
</html>
