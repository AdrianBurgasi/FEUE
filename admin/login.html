<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/png" href="../assets/feue_favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#030a17">
    <title>Acceso Directiva | FEUE ULEAM</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --primary: #0b1f42;
            --secondary: #030a17;
            --gold: #e0a922;
            --light: #f4f4f4;
            --muted: #aeb8c9;
            --border: rgba(224, 169, 34, 0.28);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 28px 18px;
            overflow-x: hidden;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(11, 31, 66, 0.95), transparent 58%),
                var(--secondary);
            color: var(--light);
            font-family: 'Montserrat', sans-serif;
        }

        body::before,
        body::after {
            position: fixed;
            z-index: -1;
            width: 280px;
            height: 280px;
            border: 1px solid rgba(224, 169, 34, 0.12);
            border-radius: 50%;
            content: "";
            pointer-events: none;
        }

        body::before { top: -150px; right: -100px; }
        body::after { bottom: -180px; left: -110px; width: 360px; height: 360px; }

        .login-shell { width: min(100%, 440px); }

        .login-card {
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: linear-gradient(155deg, rgba(11, 31, 66, 0.97), rgba(3, 10, 23, 0.99) 72%);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.48), 0 0 36px rgba(11, 31, 66, 0.22);
        }

        .brand-panel {
            display: grid;
            min-height: 148px;
            place-items: center;
            padding: 24px;
            background: rgba(198, 224, 255, 0.98);
            border-bottom: 1px solid rgba(224, 169, 34, 0.55);
        }

        .brand-panel img {
            display: block;
            width: min(100%, 260px);
            max-height: 96px;
            object-fit: contain;
        }

        .login-content { padding: 34px clamp(22px, 7vw, 42px) 36px; }

        .eyebrow {
            margin: 0 0 9px;
            color: var(--gold);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2.2px;
            text-align: center;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            color: var(--light);
            font-family: 'Cinzel', serif;
            font-size: clamp(23px, 6vw, 29px);
            font-weight: 600;
            line-height: 1.3;
            text-align: center;
        }

        .intro {
            margin: 12px 0 29px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.7;
            text-align: center;
        }

        .form-group { margin-bottom: 19px; }

        label {
            display: block;
            margin-bottom: 8px;
            color: #e5e9f1;
            font-size: 12px;
            font-weight: 600;
        }

        input {
            width: 100%;
            min-height: 48px;
            padding: 12px 14px;
            border: 1px solid rgba(174, 184, 201, 0.26);
            border-radius: 7px;
            outline: none;
            background: rgba(255, 255, 255, 0.045);
            color: var(--light);
            font: inherit;
            font-size: 14px;
            transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
        }

        input::placeholder { color: #8994a8; }
        input:focus {
            border-color: var(--gold);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 0 3px rgba(224, 169, 34, 0.12);
        }

        .login-button {
            width: 100%;
            min-height: 49px;
            margin-top: 6px;
            border: 0;
            border-radius: 7px;
            background: linear-gradient(90deg, #d4af37, #f9d976, #d4af37);
            color: var(--primary);
            cursor: pointer;
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: transform 160ms ease, box-shadow 160ms ease, opacity 160ms ease;
        }

        .login-button:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 8px 22px rgba(224, 169, 34, 0.24);
        }

        .login-button:focus-visible {
            outline: 3px solid rgba(249, 217, 118, 0.55);
            outline-offset: 3px;
        }

        .login-button:disabled { cursor: wait; opacity: 0.7; }

        .error-message {
            min-height: 20px;
            margin: 14px 0 0;
            color: #ff9c9c;
            font-size: 12px;
            line-height: 1.6;
            text-align: center;
        }

        .login-footer {
            margin: 20px 0 0;
            color: #8792a5;
            font-size: 11px;
            line-height: 1.6;
            text-align: center;
        }

        .login-footer strong {
            color: var(--gold);
            font-family: 'Cinzel', serif;
            font-weight: 600;
        }

        @media (max-width: 420px) {
            body { padding: 18px 14px; }
            .brand-panel { min-height: 126px; }
            .brand-panel img { max-height: 78px; }
            .login-content { padding-top: 28px; padding-bottom: 28px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <main class="login-shell">
        <section class="login-card" aria-labelledby="loginTitle">
            <div class="brand-panel">
                <img src="../assets/feue_logo_horizontal.png" alt="FEUE ULEAM">
            </div>
            <div class="login-content">
                <p class="eyebrow">Portal institucional</p>
                <h1 id="loginTitle">Acceso a Directivas</h1>
                <p class="intro">Ingresa con tu cuenta autorizada para continuar al sistema de gestión.</p>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" name="email" placeholder="nombre@institucion.edu.ec" autocomplete="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
                    </div>
                    <button class="login-button" id="loginBtn" type="submit">Iniciar sesión</button>
                </form>
                <p class="error-message" id="mensajeError" role="alert" aria-live="polite"></p>
                <p class="login-footer">Acceso exclusivo para miembros autorizados<br><strong>FEUE ULEAM</strong></p>
            </div>
        </section>
    </main>

    <!-- Usamos módulos (type="module") para la versión moderna de Firebase -->
    <script type="module">
        // 1. Importar las funciones de Firebase desde internet
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // 2. PEGA TU CONFIGURACIÓN AQUÍ (Copiada del Paso 3)
        const firebaseConfig = {
        apiKey: "AIzaSyCexqyV6YOJ8BdIVKKH743XBJyHRIqYRPs",
        authDomain: "murga-invitations.firebaseapp.com",
        projectId: "murga-invitations",
        storageBucket: "murga-invitations.firebasestorage.app",
        messagingSenderId: "484487993547",
        appId: "1:484487993547:web:c96aa399f71d614b1a634e",
        measurementId: "G-XG2HNRTE5C"
    };

        // 3. Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) window.location.replace("pag_gobierno.html");
        }, (error) => {
            console.error("No se pudo verificar la sesión de Firebase:", error);
            document.getElementById('mensajeError').innerText = "No se pudo verificar la sesión. Inténtalo nuevamente.";
        });

        document.getElementById('loginForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const mensajeError = document.getElementById('mensajeError');
            const loginBtn = document.getElementById('loginBtn');

            mensajeError.innerText = "";
            loginBtn.disabled = true;
            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.replace("gobierno.html");
            } catch (error) {
                console.error("No se pudo iniciar sesión:", error);
                mensajeError.innerText = "Credenciales incorrectas o usuario no existe.";
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
